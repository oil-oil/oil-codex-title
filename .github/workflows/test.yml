name: 跨平台验证
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.13'
    env:
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 程序与真实进程锁测试
        run: python -m unittest discover -s tests -v
      - name: 安装官方 Codex CLI
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: npm install -g @openai/codex
      - name: Windows 原生 CLI 连接检查（不调用模型）
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: python scripts/mogoo_codex_title.py doctor
