<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Codex 话题实时命名，更好区分</title>
  <desc id="desc">三组带 emoji 的合成标题对比：你好变成邮箱验证码｜过期排查，帮我看一下变成图像模型对比｜视频策划，继续修改变成登录表单｜布局优化。每轮对话结束后由独立 Luna Fast 判断。</desc>
  <rect width="1200" height="440" rx="22" fill="#F4F3ED"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
    <text x="40" y="40" font-size="20" font-weight="600" fill="#62766A">mogoo-codex-title</text>
    <g transform="translate(966 18)">
      <rect width="194" height="34" rx="17" fill="#E2EAE1"/>
      <circle cx="20" cy="17" r="4" fill="#397256"/>
      <text x="34" y="23" font-size="18" fill="#355D46">独立 Luna Fast</text>
    </g>
    <text x="38" y="101" font-size="48" font-weight="700" letter-spacing="-1" fill="#193A2B">Codex 话题实时命名，<tspan fill="#397B51">更好区分。</tspan></text>
    <text x="40" y="139" font-size="22" fill="#62766A">emoji 分类，具体目标一眼可见。</text>

    <g id="before" transform="translate(40 166)">
      <rect width="356" height="216" rx="14" fill="#EAEAE3"/>
      <text x="22" y="32" font-size="20" font-weight="600" fill="#778177">原来的标题</text>
      <path d="M22 45h312" stroke="#D1D7CD"/>
      <g fill="#7B857B" font-size="28">
        <text x="24" y="87">你好</text>
        <text x="24" y="141">帮我看一下</text>
        <text x="24" y="195">继续修改</text>
      </g>
    </g>
    <g id="rename-arrows" fill="none" stroke="#76A287" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M414 243h43m-9-8 9 8-9 8"/>
      <path d="M414 297h43m-9-8 9 8-9 8"/>
      <path d="M414 351h43m-9-8 9 8-9 8"/>
    </g>
    <g id="after" transform="translate(476 166)">
      <rect width="684" height="216" rx="14" fill="#FFFFFF"/>
      <text x="22" y="32" font-size="20" font-weight="600" fill="#397B51">现在，一眼认出正在做什么</text>
      <path d="M22 45h640" stroke="#E3EAE1"/>
      <rect x="12" y="56" width="660" height="44" rx="9" fill="#E8F1E7"/>
      <rect x="12" y="110" width="660" height="44" rx="9" fill="#EFF2FA"/>
      <rect x="12" y="164" width="660" height="44" rx="9" fill="#F6EEF4"/>
      <g font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" font-size="28">
        <text x="24" y="88">🧩</text>
        <text x="24" y="142">🎬</text>
        <text x="24" y="196">🎨</text>
      </g>
      <g fill="#233D2F" font-size="29" font-weight="550">
        <text x="72" y="88">邮箱验证码｜过期排查</text>
        <text x="72" y="142">图像模型对比｜视频策划</text>
        <text x="72" y="196">登录表单｜布局优化</text>
      </g>
    </g>
    <text x="40" y="417" font-size="20" fill="#62766A">每轮结束后自动判断 · 参考最近 3～5 轮 · 命名消息不进入原对话</text>
  </g>
</svg>
